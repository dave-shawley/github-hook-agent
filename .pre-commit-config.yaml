# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v0.9.17
    hooks:
      - id: tombi-format
        exclude: uv.lock
  - repo: local
    hooks:
      - id: check-trailing-whitespace
        name: cleanup trailing whitespace
        entry: just --justfile justfile hooks::check-trailing-whitespace
        language: system
        types: [text]
      - id: check-end-of-file
        name: ensure newline at end of file
        entry: just --justfile justfile hooks::check-end-of-file
        language: system
        types: [text]
