[project]
name = "github-hook-agent"
version = "0.0.0"
description = "Agent actions triggered by GitHub webhook notifications"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [{ name = "Dave Shawley", email = "daveshawley@gmail.com" }]
dependencies = []

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pyrefly>=1.2.0",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.3",
  "tombi>=1.4.1",
  "ty>=0.0.73",
  "watchfiles>=1.2.0",
]

[build-system]
requires = ["uv_build~=0.11.29"]
build-backend = "uv_build"

[tool.pyrefly]
infer-return-types = "never"
min-severity = "warn"
python-version = "3.14"
use-ignore-files = true

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ISC",
  "LOG",
  "N",
  "Q",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RSE",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "RSE102",  # I like to raise exception instances not classes
  "TC002",  # I don't like separating imports for type checking
  "TC003",  # This doesn't work with pydantic
  "TRY003",  # Allow messages in exception initializers
]
flake8-quotes = { inline-quotes = "single" }
pydocstyle = { convention = "google" }
isort = { split-on-trailing-comma = false }

[tool.uv]
package = false
required-version = " >=0.10.0"

# since I occasiontally work inside of a sandbox
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = [
  "apps/github-webhook",
]
